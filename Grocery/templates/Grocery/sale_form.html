<!-- templates/Grocery/sale_form.html -->
{% extends 'Grocery/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-cart-plus"></i> Record Sale</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Select product and enter quantity in kilograms. Stock will be automatically updated.</p>
                {% crispy form %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
