<!-- templates/Grocery/sale_form.html -->
{% extends 'Grocery/base.html' %}
{% load crispy_forms_tags %}

{% block page_title %}Record Sale{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1><i class="bi bi-cart-plus text-success"></i> Record a Sale</h1>
        <p class="page-sub">Select a product and enter the quantity. Stock updates automatically.</p>
    </div>
    <div class="page-actions">
        <a href="{% url 'Grocery:sales_list' %}" class="btn btn-outline-success"><i class="bi bi-arrow-left"></i> Back to Sales</a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-body p-4">
                {% crispy form %}
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const typeInputs = document.querySelectorAll('input[name="sale_type"]');
        const dateWrap = document.getElementById('div_id_sale_date');
        const timeWrap = document.getElementById('div_id_sale_time');
        const dateField = document.getElementById('id_sale_date');
        const timeField = document.getElementById('id_sale_time');

        function updateSaleTimingFields() {
            const selected = document.querySelector('input[name="sale_type"]:checked');
            const showPrevious = selected && selected.value === 'previous';

            if (dateWrap) dateWrap.style.display = showPrevious ? '' : 'none';
            if (timeWrap) timeWrap.style.display = showPrevious ? '' : 'none';

            if (dateField) dateField.required = showPrevious;
            if (timeField) timeField.required = showPrevious;
        }

        typeInputs.forEach(function (input) {
            input.addEventListener('change', updateSaleTimingFields);
        });

        updateSaleTimingFields();
    });
</script>
{% endblock %}
