{% extends 'Grocery/base.html' %}
{% load crispy_forms_tags %}

{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1><i class="bi bi-person-gear text-success"></i> {{ title }}</h1>
        <p class="page-sub">Provision or update a team member's access.</p>
    </div>
    <div class="page-actions">
        <a href="{% url 'Grocery:user_list' %}" class="btn btn-outline-success"><i class="bi bi-arrow-left"></i> Back to Users</a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% crispy form %}
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> Save User</button>
                        <a href="{% url 'Grocery:user_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
