<!-- templates/Grocery/change_password.html -->
{% extends 'Grocery/base.html' %}
{% load crispy_forms_tags %}

{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1><i class="bi bi-key text-success"></i> Change Password</h1>
        <p class="page-sub">Choose a strong password to protect your account.</p>
    </div>
    <div class="page-actions">
        <a href="{% url 'Grocery:settings' %}" class="btn btn-outline-success"><i class="bi bi-arrow-left"></i> Back to Settings</a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body p-4">
                {% crispy form %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
