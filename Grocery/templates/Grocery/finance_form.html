{% extends 'Grocery/base.html' %}
{% load crispy_forms_tags %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header"><div><h1><i class="bi {{ icon }} text-success"></i> {{ title }}</h1><p class="page-sub">This entry immediately flows into your finance dashboard.</p></div><a href="{% url 'Grocery:finance_dashboard' %}" class="btn btn-outline-success"><i class="bi bi-arrow-left"></i> Back to finance</a></div>
<div class="row justify-content-center"><div class="col-xl-8"><div class="card"><div class="card-body p-4">
    <form method="post">{% csrf_token %}{{ form|crispy }}<div class="d-flex gap-2 mt-3"><button class="btn btn-success"><i class="bi bi-check2-circle"></i> Save entry</button><a href="{% url 'Grocery:finance_dashboard' %}" class="btn btn-light">Cancel</a></div></form>
</div></div></div></div>
{% endblock %}
