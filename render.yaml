services:
  - type: web
    name: grocery-management
    runtime: python
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py init_admin
    startCommand: gunicorn grocery_management.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: grocery-management-db
          property: connectionString

databases:
  - name: grocery-management-db
    plan: free
